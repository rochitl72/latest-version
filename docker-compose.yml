# ─────────────────────────────────────────────────────────────────────
# RBG Annotation Studio — full-stack deployment
#
#   1. cp .env.example .env      and edit the secrets
#   2. docker compose up -d --build
#   3. open http://localhost:8080
#
# Services:
#   postgres  — the database (data persisted in the pgdata volume)
#   backend   — FastAPI API (uploaded images persisted in the storage volume)
#   frontend  — nginx serving the built SPA and proxying /api + /ws to backend
# ─────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: rbg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-annoforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-annoforge}
      POSTGRES_DB: ${POSTGRES_DB:-annoforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published on the LOOPBACK interface only, so a GUI client (TablePlus,
      # DBeaver, pgAdmin, Postico) on this machine can connect to
      # localhost:5432 — while the database stays unreachable from the network.
      #
      # The "127.0.0.1:" prefix is what makes that true. Writing just
      # "5432:5432" would bind 0.0.0.0 and expose the database to everyone on
      # the LAN. On the RBG server, either keep this prefix or delete these two
      # lines entirely (the backend talks to postgres over the internal compose
      # network and does not need the port published at all).
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      # The backend waits for this to pass before it starts (see depends_on).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-annoforge} -d ${POSTGRES_DB:-annoforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: rbg-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      # In production the app refuses to boot without these — set them in .env.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      SEED_TEST_USER: ${SEED_TEST_USER:-false}
      # Database — point at the postgres service by its container name.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-annoforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-annoforge}
      POSTGRES_DB: ${POSTGRES_DB:-annoforge}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - storage:/data/storage
      - exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy
    # Not published to the host: only the frontend (nginx) reaches it over the
    # internal compose network. Uncomment to hit the API directly for debugging.
    # ports:
    #   - "8000:8000"

  frontend:
    build: ./frontend
    container_name: rbg-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      # Wait for the API's healthcheck, not just for the container to exist.
      # nginx resolves the `backend` hostname when it starts; if it comes up
      # first, the very first page load 502s.
      backend:
        condition: service_healthy

  # ── Optional: pgAdmin, a database browser in your browser ───────────
  # Not started by default. Bring it up only when you want it:
  #     docker compose --profile tools up -d pgadmin
  #     open http://localhost:5050
  # Log in with PGADMIN_EMAIL / PGADMIN_PASSWORD (defaults below), then add a
  # server with  host: postgres   port: 5432   user/password: your POSTGRES_*.
  # Stop it again with:  docker compose --profile tools down
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rbg-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:     # database files
  storage:    # uploaded images
  exports:    # generated dataset exports
  pgadmin:    # pgAdmin's own settings (only used with --profile tools)
