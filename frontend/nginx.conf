# nginx config for the frontend container.
#
# Serves the compiled single-page app and reverse-proxies everything the app
# needs from the backend, so the browser sees a single same-origin server
# (no CORS, no separate API host to configure).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large multi-file image uploads to pass through to the backend.
    client_max_body_size 512m;

    # REST API → backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend health probe (used by monitoring / the API status banner).
    location = /health {
        proxy_pass http://backend:8000;
    }

    # Client-side routing: any unknown path falls back to index.html so deep
    # links and browser refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
